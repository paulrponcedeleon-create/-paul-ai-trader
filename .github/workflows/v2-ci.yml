name: v2-ci

on:
  pull_request:
    branches:
      - v2-dashboard
  push:
    branches:
      - v2-dashboard

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      APP_PASSWORD: test-password
      SESSION_SECRET: test-session-secret-with-more-than-32-characters
      SESSION_COOKIE_SECURE: "false"
      LIVE_TRADING: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Validate Alembic migration
        env:
          DATABASE_URL: sqlite:////tmp/paul_ai_trader_ci.db
        run: |
          rm -f /tmp/paul_ai_trader_ci.db
          python -m alembic upgrade head
          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("/tmp/paul_ai_trader_ci.db")
          tables = {
              row[0]
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          indexes = {
              row[0]
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='index'"
              )
          }
          revision = connection.execute(
              "SELECT version_num FROM alembic_version"
          ).fetchone()
          connection.close()

          assert "alembic_version" in tables
          assert "simulated_orders" in tables
          assert "ix_simulated_orders_book" in indexes
          assert "ix_simulated_orders_correlation_id" in indexes
          assert revision == ("20260720_0001",)
          PY
