name: v2-ci

on:
  pull_request:
    branches:
      - v2-dashboard
  push:
    branches:
      - v2-dashboard

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > pytest-output.txt 2>&1
          exit_code=$?
          cat pytest-output.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish pytest failure on PR
        if: steps.pytest.outputs.exit_code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('pytest-output.txt', 'utf8');
            const excerpt = output.slice(-6000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### v2-ci: pytest falló\n\n\`\`\`text\n${excerpt}\n\`\`\``
            });

      - name: Stop after pytest failure
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1

      - name: Validate Alembic migration
        env:
          DATABASE_URL: sqlite:////tmp/paul_ai_trader_ci.db
        run: |
          rm -f /tmp/paul_ai_trader_ci.db
          python -m alembic upgrade head
          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("/tmp/paul_ai_trader_ci.db")
          tables = {
              row[0]
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          indexes = {
              row[0]
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='index'"
              )
          }
          revision = connection.execute(
              "SELECT version_num FROM alembic_version"
          ).fetchone()
          connection.close()

          assert "alembic_version" in tables
          assert "simulated_orders" in tables
          assert "ix_simulated_orders_book" in indexes
          assert "ix_simulated_orders_correlation_id" in indexes
          assert revision == ("20260720_0001",)
          PY
