name: v2-ci

on:
  pull_request:
    branches:
      - v2-dashboard
  push:
    branches:
      - v2-dashboard

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > pytest-output.txt 2>&1
          exit_code=$?
          cat pytest-output.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish pytest failure on PR
        if: steps.pytest.outputs.exit_code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('pytest-output.txt', 'utf8');
            const excerpt = output.slice(-6000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### v2-ci: pytest falló\n\n\`\`\`text\n${excerpt}\n\`\`\``
            });

      - name: Stop after pytest failure
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1

      - name: Validate Alembic migration
        env:
          DATABASE_URL: sqlite:////tmp/paul_ai_trader_ci.db
        run: |
          rm -f /tmp/paul_ai_trader_ci.db
          python -m alembic upgrade head
          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("/tmp/paul_ai_trader_ci.db")
          tables = {
              row[0]
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          indexes = {
              row[0]
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='index'"
              )
          }
          columns = {
              row[1]: row[2].upper()
              for row in connection.execute("PRAGMA table_info(simulated_orders)")
          }
          order_event_columns = {
              row[1]: row[2].upper()
              for row in connection.execute(
                  "PRAGMA table_info(simulated_order_events)"
              )
          }
          user_columns = {
              row[1]: row[2].upper()
              for row in connection.execute("PRAGMA table_info(user_accounts)")
          }
          owner = connection.execute(
              "SELECT username, simulated_initial_capital_mxn FROM user_accounts WHERE id='owner'"
          ).fetchone()
          revision = connection.execute(
              "SELECT version_num FROM alembic_version"
          ).fetchone()
          connection.close()

          assert {
              "alembic_version",
              "simulated_orders",
              "simulated_order_events",
              "user_accounts",
              "backtest_runs",
              "optimization_runs",
              "paper_accounts",
              "analytics_snapshots",
              "analytics_events",
          }.issubset(tables)
          assert {
              "ix_simulated_orders_book",
              "ix_simulated_orders_correlation_id",
              "ix_simulated_orders_status",
              "ix_simulated_orders_source",
              "ix_simulated_orders_user_id",
              "ix_simulated_order_events_created_at",
              "ix_simulated_order_events_position_id",
              "ix_simulated_order_events_side",
              "ix_simulated_order_events_source",
              "ix_simulated_order_events_user_id",
              "ix_user_accounts_username",
              "ix_user_accounts_is_active",
              "ix_analytics_snapshots_created_at",
              "ix_analytics_events_timestamp",
          }.issubset(indexes)
          assert {
              "closed_at",
              "close_price",
              "realized_pnl_mxn",
              "entry_fee_rate",
              "entry_fee_mxn",
              "exit_fee_rate",
              "exit_fee_mxn",
              "parent_position_id",
              "source",
              "user_id",
          }.issubset(columns)
          assert {
              "position_id",
              "book",
              "side",
              "status",
              "amount_mxn",
              "price",
              "fee_mxn",
              "realized_pnl_mxn",
              "source",
              "reason",
              "correlation_id",
              "user_id",
          }.issubset(order_event_columns)
          assert {
              "username",
              "password_hash",
              "bot_enabled",
              "ai_exploration_enabled",
              "shared_learning_enabled",
              "simulated_initial_capital_mxn",
              "bitso_api_key_encrypted",
              "bitso_api_secret_encrypted",
          }.issubset(user_columns)
          assert owner[0] == "paul"
          assert float(owner[1]) == 5000.0

          for column in (
              "amount_mxn",
              "reference_price",
              "close_price",
              "entry_fee_rate",
              "entry_fee_mxn",
              "exit_fee_rate",
              "exit_fee_mxn",
              "realized_pnl_mxn",
          ):
              assert columns[column].startswith("NUMERIC"), (column, columns[column])
          for column in ("amount_mxn", "price", "fee_mxn", "realized_pnl_mxn"):
              assert order_event_columns[column].startswith("NUMERIC"), (
                  column,
                  order_event_columns[column],
              )
          assert revision == ("20260724_0012",)
          PY
