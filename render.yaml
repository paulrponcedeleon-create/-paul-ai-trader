services:
  - type: web
    name: paul-ai-trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: "production"
      - key: OWNER_USERNAME
        value: "paul"
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: USER_REGISTRATION_CODE
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: COMMUNITY_LEARNING_ENABLED
        value: "true"
      - key: BITSO_BASE_URL
        value: "https://api.bitso.com/api/v3"
      - key: BITSO_API_KEY
        sync: false
      - key: BITSO_API_SECRET
        sync: false
      - key: LIVE_TRADING
        value: "false"
      - key: SIMULATED_INITIAL_CAPITAL_MXN
        value: "5000"
      - key: RUNTIME_AUTO_START
        value: "true"
      - key: MAX_ORDER_MXN
        value: "200"
      - key: MAX_DAILY_LOSS_MXN
        value: "100"
      - key: ALLOWED_BOOKS
        value: "btc_mxn,eth_mxn,xrp_mxn,sol_mxn"
